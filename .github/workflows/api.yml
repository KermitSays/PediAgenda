name: API e MySQL

on:
  push:
    paths:
      - 'api/**'
      - 'nucleo/**'
      - 'banco/**'
      - 'testes/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'nucleo/**'
      - 'banco/**'
      - 'testes/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysqlLocalTeste123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysqlLocalTeste123"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente MySQL
        run: sudo apt-get update -qq && sudo apt-get install -y mysql-client
      - name: Compilar API
        run: dotnet build api/PediAgenda.Api.csproj --nologo
      - name: Compilar console de login
        run: dotnet build login/PediAgenda.Login.csproj --nologo
      - name: Testar API e banco
        env:
          MYSQL_PASSWORD: mysqlLocalTeste123
          PEDIAGENDA_TESTE_DESTRUTIVO: SIM
        run: python testes/integracao_api.py
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-api
          path: |
            /tmp/pediagenda-resultados.json
            /tmp/pediagenda-api-testes.log
